name: Build and deploy HOLOCAD to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# The deploy action reads the uploaded Pages artifact through the Actions API.
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate static entry point
        run: test -s index.html
      - name: Validate inline module JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          marker = '<script type="module">'
          start = html.rfind(marker)
          end = html.find('</script>', start + len(marker))
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the inline JavaScript module in index.html")
          Path("/tmp/holocad-module.mjs").write_text(html[start + len(marker):end], encoding="utf-8")
          PY
          node --check /tmp/holocad-module.mjs
      - name: Validate Phase 5 AI module
        run: node --check phase5.js
      - name: Inject Phase 5 AI module into the Pages artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          tag = '<script src="./phase5.js" defer></script>'
          if tag not in html:
              marker = '</body>'
              if marker not in html:
                  raise SystemExit("Could not find </body> in index.html")
              html = html.replace(marker, f'{tag}\n{marker}', 1)
              p.write_text(html, encoding="utf-8")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
